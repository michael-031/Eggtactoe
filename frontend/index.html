<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Egg Chess</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="game-wrapper">

    <!-- ── Title ───────────────────────────────────────── -->
    <header class="title-bar">
      <span class="title-egg left">🥚</span>
      <h1>EGG&nbsp;CHESS</h1>
      <span class="title-egg right">🥚</span>
    </header>

    <!-- ── Mode selector ───────────────────────────────── -->
    <div class="mode-bar">
      <label class="mode-option">
        <input type="radio" name="gameMode" id="mode-pvp" value="pvp" checked>
        <span class="mode-label">👥 2 Players</span>
      </label>
      <label class="mode-option">
        <input type="radio" name="gameMode" id="mode-pva" value="pva">
        <span class="mode-label">🤖 vs AI</span>
      </label>
      <label class="mode-option">
        <input type="radio" name="gameMode" id="mode-online" value="online">
        <span class="mode-label">🌐 Online</span>
      </label>
    </div>
    <div class="api-key-row hidden" id="api-key-row">
      <input type="password" id="api-key-input"
             placeholder="Gemini API key — free at aistudio.google.com">
      <button class="btn-save-key" id="save-key-btn">Save</button>
    </div>

    <!-- ── Online lobby ─────────────────────────────────── -->
    <div class="online-lobby hidden" id="online-lobby">
      <div class="lobby-create" id="lobby-create">
        <button class="btn-create-room" id="btn-create-room">Create Room</button>
        <p class="lobby-or">— or —</p>
        <div class="lobby-join-row">
          <input type="text" id="join-code-input"
                 placeholder="Room code" maxlength="6" autocomplete="off">
          <button class="btn-join-room" id="btn-join-room">Join</button>
        </div>
      </div>
      <div class="lobby-waiting hidden" id="lobby-waiting">
        <p class="room-code-label">Room code</p>
        <div class="room-code-display" id="room-code-display">——</div>
        <p class="waiting-msg" id="waiting-msg">Waiting for Player 2…</p>
      </div>
    </div>

    <!-- ── Player 2 (top) ──────────────────────────────── -->
    <section class="player-zone p2-zone" id="p2-zone">
      <div class="player-header">
        <div class="player-crown p2-crown">♛</div>
        <span class="player-name" id="p2-name">Player 2</span>
        <span class="ai-badge hidden" id="p2-ai-badge">🤖 AI</span>
        <div class="turn-pip" id="p2-pip"></div>
      </div>
      <div class="piece-tray" id="p2-tray"></div>
    </section>

    <!-- ── Board ───────────────────────────────────────── -->
    <main class="board-wrap">
      <div class="board-disc">
        <div class="board-ring-outer"></div>
        <div class="board-ring-inner"></div>
        <div class="board-grid" id="board-grid">
          <!-- 9 cells injected by JS -->
        </div>
        <!-- AI thinking overlay -->
        <div class="ai-thinking hidden" id="ai-thinking">
          <div class="ai-spinner"></div>
          <span>Gemini is thinking…</span>
        </div>
      </div>
    </main>

    <!-- ── Player 1 (bottom) ───────────────────────────── -->
    <section class="player-zone p1-zone" id="p1-zone">
      <div class="player-header">
        <div class="player-crown p1-crown">♚</div>
        <span class="player-name" id="p1-name">Player 1</span>
        <div class="turn-pip" id="p1-pip"></div>
      </div>
      <div class="piece-tray" id="p1-tray"></div>
    </section>

    <!-- ── Status bar ─────────────────────────────────── -->
    <footer class="status-bar">
      <p class="status-msg" id="status-msg">Connecting…</p>
      <button class="btn-reset" id="btn-reset">New Game</button>
    </footer>

  </div>

  <!-- Selection hint tooltip -->
  <div class="hint-bubble" id="hint-bubble">Click a cell to place</div>

  <!-- Win overlay -->
  <div class="win-overlay hidden" id="win-overlay">
    <div class="win-card">
      <div class="win-egg-anim" id="win-egg"></div>
      <h2 id="win-title">Player 1 Wins!</h2>
      <p id="win-sub">Three in a row!</p>
      <button class="btn-reset btn-win-reset" id="btn-win-reset">Play Again</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
